# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=smart-stock-analyzer
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# Local dev default — H2 in-memory.
# On Render, set SPRING_DATASOURCE_URL=jdbc:postgresql://... directly.
# Spring Boot maps SPRING_DATASOURCE_URL → spring.datasource.url automatically.
spring.datasource.url=jdbc:h2:mem:stockanalyzerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${ENABLE_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:SmartStockAnalyzerLocalDevSecretKeyChangeThisInProduction}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Alpha Vantage ─────────────────────────────────────────────────────────────
app.alphavantage.api-key=${ALPHA_VANTAGE_KEY:demo}
app.alphavantage.base-url=https://www.alphavantage.co/query

# ── Virtual Portfolio ─────────────────────────────────────────────────────────
app.portfolio.initial-balance=100000.00

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=simple

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.stockanalyzer=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Mail ──────────────────────────────────────────────────────────────────────
# Mail is disabled — MailSenderAutoConfiguration excluded in main class.
# To enable, remove the exclusion and set MAIL_USERNAME + MAIL_PASSWORD on Render.
