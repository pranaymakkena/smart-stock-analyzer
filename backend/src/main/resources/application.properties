# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=smart-stock-analyzer

# Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# DataSourceConfig.java handles DATABASE_URL normalisation automatically.
# Render gives postgres://... — the config bean converts it to jdbc:postgresql://
# Locally with no DATABASE_URL set, H2 in-memory is used automatically.

# H2 console — disable in production
spring.h2.console.enabled=${ENABLE_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# REQUIRED on Render — set JWT_SECRET env var (min 32 chars)
app.jwt.secret=${JWT_SECRET:SmartStockAnalyzerLocalDevSecretKeyChangeThisInProduction}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS on Render to your Vercel URL, e.g.:
# https://smart-stock-analyzer.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Alpha Vantage ─────────────────────────────────────────────────────────────
app.alphavantage.api-key=${ALPHA_VANTAGE_KEY:demo}
app.alphavantage.base-url=https://www.alphavantage.co/query

# ── Virtual Portfolio ─────────────────────────────────────────────────────────
app.portfolio.initial-balance=100000.00

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=simple

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.stockanalyzer=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Mail (optional) ───────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
