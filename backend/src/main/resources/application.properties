# ===== Server =====
spring.application.name=smart-stock-analyzer
server.port=${PORT:8080}

# ===== Database =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stockanalyzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL for Render PostgreSQL
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:require}

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-init-sql=SELECT 1

# Defer datasource init so app starts even if DB is slow
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:SmartStockAnalyzerLocalDevSecretKeyChangeThisInProduction}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Alpha Vantage =====
app.alphavantage.api-key=${ALPHA_VANTAGE_KEY:demo}
app.alphavantage.base-url=https://www.alphavantage.co/query

# ===== Portfolio =====
app.portfolio.initial-balance=100000.00

# ===== Cache =====
spring.cache.type=simple

# ===== Logging =====
logging.level.com.stockanalyzer=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.root=WARN
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

# ===== H2 Console (local only) =====
spring.h2.console.enabled=false
