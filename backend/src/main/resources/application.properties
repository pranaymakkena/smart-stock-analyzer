# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=smart-stock-analyzer
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockanalyzerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=${ENABLE_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:SmartStockAnalyzerLocalDevSecretKeyChangeThisInProduction}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Alpha Vantage ─────────────────────────────────────────────────────────────
app.alphavantage.api-key=${ALPHA_VANTAGE_KEY:demo}
app.alphavantage.base-url=https://www.alphavantage.co/query

# ── Portfolio ─────────────────────────────────────────────────────────────────
app.portfolio.initial-balance=100000.00

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=simple

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.stockanalyzer=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
